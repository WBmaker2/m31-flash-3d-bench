<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 주사위 놀이 — three.js</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <style>
      :root {
        --accent: #ffc451;
        --teal: #57d9d0;
        --ink: #ecebe4;
        --ink-soft: #9aa39c;
        --line: rgba(255, 255, 255, 0.13);
        --panel: rgba(18, 21, 28, 0.9);
        --panel-solid: #12151c;
        --font-mono: "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1a24;
        color: var(--ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .panel-head {
        top: 18px;
        left: 18px;
        width: 340px;
        max-width: calc(100vw - 36px);
        padding: 14px 18px;
      }

      .panel-head .kicker {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--accent);
      }

      .panel-head h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
      }

      .panel-head .status {
        margin: 8px 0 0;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink);
      }

      .panel-head .status.is-bad {
        color: #ffb0a5;
      }

      .stats {
        margin: 10px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 5px 12px;
        font-size: 12.5px;
      }

      .stats dt {
        color: var(--ink-soft);
        margin: 0;
      }

      .stats dd {
        margin: 0;
        text-align: right;
        font-weight: 600;
      }

      .score-list {
        margin: 10px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
      }

      .score-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid transparent;
        color: var(--ink-soft);
      }

      .score-row.is-turn {
        color: var(--ink);
        border-color: rgba(255, 196, 81, 0.5);
        background: rgba(255, 196, 81, 0.1);
      }

      .score-name {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .score-name::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--chip, #fff);
      }

      .question {
        margin: 10px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--accent);
        min-height: 20px;
      }

      .panel-bar {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        max-width: min(760px, calc(100vw - 36px));
      }

      .panel-bar .group {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .panel-bar .group + .group {
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }

      .panel-bar button {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .panel-bar button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .panel-bar button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .panel-bar .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1c1a24;
        font-weight: 700;
      }

      .panel-bar .btn-primary:hover {
        color: #1c1a24;
      }

      .panel-bar #choices:empty {
        display: none;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 196, 81, 0.5);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(255, 196, 81, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .hint-keys {
        right: 18px;
        bottom: 18px;
        padding: 9px 13px;
        font-size: 11.5px;
        line-height: 1.8;
        color: var(--ink-soft);
      }

      .hint-keys b {
        color: var(--ink);
        font-weight: 600;
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(255, 196, 81, 0.5);
      }

      @media (max-width: 760px) {
        .panel-head {
          top: 8px;
          left: 8px;
          right: 8px;
          width: auto;
          max-width: none;
          padding: 9px 12px;
        }

        .panel-head h1 {
          font-size: 15px;
          margin-bottom: 2px;
        }

        .panel-head .status {
          margin-top: 5px;
          padding-top: 5px;
          font-size: 11.5px;
        }

        .stats {
          margin-top: 6px;
          padding-top: 6px;
          gap: 3px 8px;
          font-size: 11px;
        }

        .score-list {
          margin-top: 6px;
          padding-top: 6px;
          font-size: 11px;
        }

        .question {
          margin-top: 6px;
          padding-top: 6px;
          font-size: 12.5px;
        }

        .panel-bar {
          left: 8px;
          right: 8px;
          bottom: 8px;
          transform: none;
          max-width: none;
          justify-content: flex-start;
          padding: 8px 9px;
          gap: 6px;
        }

        .panel-bar .group + .group {
          padding-left: 6px;
        }

        .panel-bar button {
          font-size: 11.5px;
          padding: 7px 9px;
        }

        .hint-keys {
          display: none;
        }

        .back-link {
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          padding: 7px 10px;
        }
      }
    </style>
  </head>

  <body>
    <canvas
      id="scene"
      role="img"
      aria-label="3D 주사위 놀이 3D 화면. 뱀과 사다리 보드 위에서 주사위를 굴리고 말을 움직이는 게임입니다."
    ></canvas>
    <a class="back-link" href="../index.html" target="_top">&#8592; GAMES</a>

    <section class="panel panel-head">
      <p class="kicker">주사위 놀이</p>
      <h1 id="board-name">첫 보드</h1>
      <p class="status" id="status-line" aria-live="polite">빨간 말 의 차례예요. 주사위를 굴려 보세요.</p>

      <dl class="stats">
        <dt>차례</dt>
        <dd id="stat-turn">빨간 말</dd>
        <dt>주사위</dt>
        <dd id="stat-value">-</dd>
      </dl>

      <div class="score-list" id="score-list"></div>
      <p class="question" id="question-text"></p>
    </section>

    <nav class="panel panel-bar">
      <div class="group" id="choices"></div>
      <div class="group">
        <button type="button" id="btn-roll" class="btn-primary btn-pulse">굴리기 (Space)</button>
        <button type="button" id="btn-reset">처음부터</button>
        <button type="button" id="btn-levels">보드 선택</button>
      </div>
    </nav>

    <p class="panel hint-keys">
      <b>Space</b> 주사위 굴리기 · <b>1 2 3</b> 정답 고르기<br />
      <b>R</b> 처음부터 · 마우스 드래그로 시점 바꾸기
    </p>

    <script>
      (async () => {
        const localMap = {
          imports: {
            three: "../vendor/three.module.js",
            "three/addons/": "../vendor/addons/",
          },
        };
        const remoteMap = {
          imports: {
            three: "https://unpkg.com/three@0.186.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          },
        };
        let map = localMap;
        try {
          await import("../vendor/three.module.js");
        } catch {
          map = remoteMap;
        }
        const tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify(map);
        document.head.append(tag);
        await import("./src/main.js");
      })();
    </script>
  </body>
</html>
