<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 로봇 팔 조립실 — three.js</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <style>
      :root {
        --accent: #ff8a3d;
        --ink: #e9e9e2;
        --ink-soft: #9aa39c;
        --line: rgba(255, 255, 255, 0.13);
        --panel: rgba(18, 20, 26, 0.88);
        --panel-solid: #15171d;
        --font-mono: "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171d;
        color: var(--ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .panel-head {
        top: 18px;
        left: 18px;
        padding: 14px 18px;
        max-width: 360px;
      }

      .panel-head .kicker {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--accent);
      }

      .panel-head h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
      }

      .panel-head p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-stats {
        top: 18px;
        right: 18px;
        padding: 12px 16px;
        min-width: 196px;
      }

      .panel-stats dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        font-size: 12.5px;
      }

      .panel-stats dt {
        color: var(--ink-soft);
        margin: 0;
      }

      .panel-stats dd {
        margin: 0;
        text-align: right;
        font-weight: 600;
      }

      .status {
        left: 18px;
        bottom: 18px;
        padding: 10px 14px;
        font-size: 12.5px;
        border-left: 2px solid var(--accent);
        max-width: 460px;
      }

      .status.is-bad {
        border-left-color: #ff6b5c;
        color: #ffb0a5;
      }

      .panel-bar {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-bar button {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        white-space: nowrap;
      }

      .panel-bar button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .panel-bar .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #15171d;
        font-weight: 700;
      }

      .panel-bar .btn-primary:hover {
        color: #15171d;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 138, 61, 0.5);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(255, 138, 61, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .hint-keys {
        right: 18px;
        bottom: 18px;
        padding: 9px 13px;
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .hint-keys b {
        color: var(--ink);
        font-weight: 600;
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(255, 138, 61, 0.5);
      }

      @media (max-width: 760px) {
        .panel-head {
          top: 10px;
          left: 10px;
          right: 86px;
          width: auto;
          max-width: none;
          padding: 9px 12px;
        }

        .panel-head h1 {
          font-size: 16px;
          margin-bottom: 0;
        }

        .panel-head p {
          display: none;
        }

        .panel-stats {
          top: 58px;
          left: 10px;
          right: 10px;
          min-width: 0;
          padding: 8px 12px;
        }

        .panel-stats dl {
          grid-template-columns: repeat(4, auto 1fr);
          gap: 4px 8px;
          font-size: 11.5px;
        }

        .status {
          left: 10px;
          right: 10px;
          bottom: 64px;
          font-size: 11.5px;
          padding: 8px 12px;
          max-width: none;
        }

        .panel-bar {
          left: 10px;
          right: 10px;
          bottom: 10px;
          transform: none;
          max-width: none;
          justify-content: space-between;
          padding: 9px 10px;
        }

        .panel-bar button {
          font-size: 12px;
          padding: 9px 10px;
        }

        .hint-keys {
          display: none;
        }

        .back-link {
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          padding: 7px 10px;
        }
      }
    </style>
  </head>

  <body>
    <canvas
      id="scene"
      role="img"
      aria-label="3D 로봇 팔 조립실 3D 화면. 작업대 위의 파란 표적 판을 클릭하면 로봇 팔이 역기구학으로 계산해 블록을 옮겨 놓습니다."
    ></canvas>
    <a class="back-link" href="../index.html" target="_top">&#8592; GAMES</a>

    <section class="panel panel-head">
      <p class="kicker">로봇 팔 조립</p>
      <h1 id="level-name">첫 조립</h1>
      <p id="level-hint">파란 판 위에 블록을 놓으세요.</p>
    </section>

    <section class="panel panel-stats">
      <dl>
        <dt>배치 오차</dt>
        <dd id="stat-error">—</dd>
        <dt>도달 반경</dt>
        <dd id="stat-reach">3.25 m</dd>
        <dt>시도</dt>
        <dd id="stat-tries">0</dd>
        <dt>상태</dt>
        <dd id="stat-state">대기</dd>
      </dl>
    </section>

    <p class="panel status" id="status-line" aria-live="polite">표적 판을 누르세요.</p>

    <nav class="panel panel-bar">
      <button id="btn-retry" class="btn-primary btn-pulse" type="button">다시 시도 (R)</button>
      <button id="btn-levels" type="button">레벨 선택</button>
    </nav>

    <p class="panel hint-keys">
      <b>클릭</b> 작업대 위치를 정함 · <b>R</b> 다시 시도 · <b>드래그</b> 시점 · <b>휠</b> 확대
    </p>

    <script>
      (async () => {
        const localMap = {
          imports: {
            three: "../vendor/three.module.js",
            "three/addons/": "../vendor/addons/",
          },
        };
        const remoteMap = {
          imports: {
            three: "https://unpkg.com/three@0.186.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          },
        };
        let map = localMap;
        try {
          await import("../vendor/three.module.js");
        } catch {
          map = remoteMap;
        }
        const tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify(map);
        document.head.append(tag);
        await import("./src/main.js");
      })();
    </script>
  </body>
</html>
