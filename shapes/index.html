<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 도형 조립실 — three.js</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <style>
      :root {
        --accent: #ffb800;
        --ink: #e9e9e2;
        --ink-soft: #9aa39c;
        --line: rgba(255, 255, 255, 0.13);
        --panel: rgba(16, 18, 22, 0.86);
        --panel-solid: #14161a;
        --font-mono: "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14161a;
        color: var(--ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .panel-head {
        top: 18px;
        left: 18px;
        padding: 14px 18px;
        max-width: 330px;
      }

      .panel-head .kicker {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--accent);
      }

      .panel-head h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
      }

      .panel-head p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-stats {
        top: 18px;
        right: 18px;
        padding: 12px 16px;
        min-width: 176px;
      }

      .panel-stats dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        font-size: 12.5px;
      }

      .panel-stats dt {
        color: var(--ink-soft);
        margin: 0;
      }

      .panel-stats dd {
        margin: 0;
        text-align: right;
        font-weight: 600;
      }

      .panel-bar {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-bar button {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
      }

      .panel-bar button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .panel-bar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .panel-bar .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #14161a;
        font-weight: 700;
      }

      .panel-bar .btn-primary:hover {
        color: #14161a;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 184, 0, 0.5);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(255, 184, 0, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .hint-keys {
        right: 18px;
        bottom: 18px;
        padding: 9px 13px;
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .hint-keys b {
        color: var(--ink);
        font-weight: 600;
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(255, 184, 0, 0.5);
      }


      .held {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 2;
        padding: 10px 14px;
        font-size: 12.5px;
        border-left: 2px solid var(--accent);
      }

      .held b {
        color: var(--accent);
      }

      @media (max-width: 760px) {
        .panel-head {
          top: 10px;
          left: 10px;
          right: 86px;
          width: auto;
          max-width: none;
          padding: 9px 12px;
        }
        .panel-head h1 {
          font-size: 16px;
          margin-bottom: 0;
        }
        .panel-head p {
          display: none;
        }
        .panel-stats {
          top: 62px;
          left: 10px;
          right: 10px;
          min-width: 0;
          padding: 8px 12px;
        }
        .panel-stats dl {
          grid-template-columns: repeat(3, auto 1fr);
          gap: 4px 8px;
          font-size: 11.5px;
        }
        .panel-bar {
          left: 10px;
          right: 10px;
          bottom: 66px;
          transform: none;
          max-width: none;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding: 9px 10px;
        }
        .panel-bar button {
          font-size: 12px;
          padding: 8px 11px;
          white-space: nowrap;
        }
        .held {
          left: 10px;
          right: 10px;
          bottom: 10px;
          font-size: 11.5px;
          padding: 8px 12px;
        }
        .hint-keys {
          display: none;
        }
        .back-link {
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          padding: 7px 10px;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="scene" role="img" aria-label="3D 도형 조립실 3D 화면. 반투명한 목표 모양을 블록으로 채웁니다. 아래 버튼으로 회전·되돌리기·레벨 선택을 할 수 있습니다."></canvas>
    <a class="back-link" href="../index.html" target="_top">&#8592; GAMES</a>

    <section class="panel panel-head">
      <p class="kicker">도형 조립</p>
      <h1 id="level-name">작은 정육면체</h1>
      <p id="level-hint">정육면체 블록을 놓아 보세요.</p>
    </section>

    <section class="panel panel-stats">
      <dl>
        <dt>채운 칸</dt>
        <dd id="stat-filled">0 / 1</dd>
        <dt>사용 블록</dt>
        <dd id="stat-used">0</dd>
        <dt>남은 블록</dt>
        <dd id="stat-left">1</dd>
      </dl>
    </section>

    <section class="panel held" id="held-panel">
      <b id="held-name">블록을 고르세요</b>
      <div id="held-detail">아래 트레이에서 블록을 눌러 고른 뒤 보드의 반투명 모양을 채우세요.</div>
    </section>

    <nav class="panel panel-bar">
      <button id="btn-rotate" type="button" disabled>회전 (R)</button>
      <button id="btn-undo" type="button" disabled>되돌리기 (Z)</button>
      <button id="btn-levels" class="btn-primary" type="button">레벨 선택</button>
    </nav>

    <p class="panel hint-keys">
      <b>R</b> 회전 · <b>Q</b> 반대 회전 · <b>Z</b> 되돌리기 · <b>드래그</b> 시점 · <b>휠</b> 확대
    </p>

    <script>
      (async () => {
        const localMap = {
          imports: {
            three: "../vendor/three.module.js",
            "three/addons/": "../vendor/addons/",
          },
        };
        const remoteMap = {
          imports: {
            three: "https://unpkg.com/three@0.186.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          },
        };
        let map = localMap;
        try {
          await import("../vendor/three.module.js");
        } catch {
          map = remoteMap;
        }
        const tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify(map);
        document.head.append(tag);
        await import("./src/main.js");
      })();
    </script>
  </body>
</html>
