<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 형태 공방 — three.js</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <style>
      :root {
        --accent: #f0a35e;
        --teal: #57d9d0;
        --ink: #ecebe4;
        --ink-soft: #9aa39c;
        --line: rgba(255, 255, 255, 0.13);
        --panel: rgba(18, 21, 28, 0.9);
        --panel-solid: #12151c;
        --font-mono: "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #171a21;
        color: var(--ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .panel-head {
        top: 18px;
        left: 18px;
        padding: 14px 18px;
        max-width: 340px;
      }

      .panel-head .kicker {
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--accent);
      }

      .panel-head h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
      }

      .panel-head p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .panel-head .status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        color: var(--ink);
      }

      .panel-head .status.is-bad {
        color: #ffb0a5;
      }

      .panel-stats {
        top: 18px;
        right: 18px;
        padding: 12px 16px;
        min-width: 224px;
      }

      .panel-stats dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        font-size: 12.5px;
      }

      .panel-stats dt {
        color: var(--ink-soft);
        margin: 0;
      }

      .panel-stats dd {
        margin: 0;
        text-align: right;
        font-weight: 600;
      }

      .panel-stats .meter {
        margin-top: 10px;
      }

      .panel-stats .meter .label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--ink-soft);
        margin-bottom: 5px;
      }

      .track {
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .track > div {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--teal);
        transition: width 0.18s linear, background 0.2s ease;
      }

      .track > div.is-warn {
        background: #ffc451;
      }

      .track > div.is-bad {
        background: #ff6b5c;
      }

      .panel-bar {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: min(760px, calc(100vw - 36px));
      }

      .panel-bar .group {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .panel-bar .group + .group {
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }

      .panel-bar button {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .panel-bar button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .panel-bar button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .panel-bar button.is-on {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(240, 163, 94, 0.14);
      }

      .panel-bar .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #171a21;
        font-weight: 700;
      }

      .panel-bar .btn-primary:hover {
        color: #171a21;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(240, 163, 94, 0.5);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(240, 163, 94, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .hint-keys {
        right: 18px;
        bottom: 18px;
        padding: 9px 13px;
        font-size: 11.5px;
        line-height: 1.8;
        color: var(--ink-soft);
      }

      .hint-keys b {
        color: var(--ink);
        font-weight: 600;
      }

      .part-info {
        left: 18px;
        bottom: 18px;
        padding: 9px 13px;
        font-size: 11.5px;
        color: var(--ink-soft);
        border-left: 2px solid var(--accent);
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(240, 163, 94, 0.5);
      }

      @media (max-width: 760px) {
        .panel-head {
          top: 10px;
          left: 10px;
          right: 10px;
          width: auto;
          max-width: none;
          padding: 9px 12px;
        }

        .panel-head h1 {
          font-size: 15px;
          margin-bottom: 2px;
        }

        .panel-head p {
          font-size: 11.5px;
          line-height: 1.45;
        }

        .panel-head .status {
          margin-top: 5px;
          padding-top: 5px;
        }

        .panel-stats {
          top: 116px;
          left: 10px;
          right: 10px;
          min-width: 0;
          padding: 8px 12px;
        }

        .panel-stats dl {
          grid-template-columns: repeat(4, auto 1fr);
          gap: 3px 8px;
          font-size: 11px;
        }

        .panel-stats .meter {
          margin-top: 6px;
        }

        .panel-bar {
          left: 10px;
          right: 10px;
          bottom: 10px;
          transform: none;
          max-width: none;
          justify-content: flex-start;
          padding: 8px 9px;
          gap: 6px;
        }

        .panel-bar .group + .group {
          padding-left: 6px;
        }

        .panel-bar button {
          font-size: 11.5px;
          padding: 7px 9px;
        }

        .hint-keys,
        .part-info {
          display: none;
        }

        .back-link {
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          padding: 7px 10px;
        }
      }
    </style>
  </head>

  <body>
    <canvas
      id="scene"
      role="img"
      aria-label="3D 형태 공방 3D 화면. 작업대 위에 기본형을 놓고 연산을 이어 반투명한 목표 형태와 최대한 닮게 만드는 게임입니다."
    ></canvas>
    <a class="back-link" href="../index.html" target="_top">&#8592; GAMES</a>

    <section class="panel panel-head">
      <p class="kicker">형태 공방</p>
      <h1 id="level-name">첫 조각</h1>
      <p id="level-hint">구 하나를 만들어 보세요.</p>
      <p class="status" id="status-line" aria-live="polite">팔레트에서 기본형을 고르고 작업대를 눌러 놓으세요.</p>
    </section>

    <section class="panel panel-stats">
      <dl>
        <dt>실루엣 일치도</dt>
        <dd id="stat-iou">0.000</dd>
        <dt>목표</dt>
        <dd id="stat-target">1.00</dd>
        <dt>부피</dt>
        <dd id="stat-volume">0%</dd>
        <dt>부품</dt>
        <dd id="stat-parts">0 / 2</dd>
      </dl>
      <div class="meter">
        <div class="label"><span>일치도</span><span>0.94 = 3성</span></div>
        <div class="track"><div id="iou-bar"></div></div>
      </div>
    </section>

    <p class="panel part-info" id="part-info">부품 0/2 · 하나를 누르면 고릅니다</p>

    <nav class="panel panel-bar">
      <div class="group">
        <button type="button" data-kind="sphere" class="is-on">구</button>
        <button type="button" data-kind="box">박스</button>
        <button type="button" data-kind="torus">토러스</button>
        <button type="button" data-kind="capsule">캡슐</button>
      </div>
      <div class="group">
        <button type="button" data-op="union" class="is-on">합</button>
        <button type="button" data-op="intersect">교</button>
        <button type="button" data-op="subtract">차</button>
      </div>
      <div class="group">
        <button type="button" id="btn-delete" disabled>삭제</button>
        <button type="button" id="btn-clear">초기화</button>
        <button type="button" id="btn-levels">레벨 선택</button>
        <button type="button" id="btn-score" class="btn-primary btn-pulse">채점 (Space)</button>
      </div>
    </nav>

    <p class="panel hint-keys">
      <b>작업대 클릭</b> 부품 놓기 · <b>부품 드래그</b> 이동<br />
      <b>1~4</b> 기본형 · <b>Q W E</b> 합 교 차<br />
      <b>[ ]</b> 회전 · <b>- =</b> 크기 · <b>Del</b> 삭제<br />
      <b>Ctrl+Z</b> 되돌리기 · <b>G</b> 고스트 · <b>R</b> 초기화
    </p>

    <script>
      (async () => {
        const localMap = {
          imports: {
            three: "../vendor/three.module.js",
            "three/addons/": "../vendor/addons/",
          },
        };
        const remoteMap = {
          imports: {
            three: "https://unpkg.com/three@0.186.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          },
        };
        let map = localMap;
        try {
          await import("../vendor/three.module.js");
        } catch {
          map = remoteMap;
        }
        const tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify(map);
        document.head.append(tag);
        await import("./src/main.js");
      })();
    </script>
  </body>
</html>
