<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 분자 빌더 — three.js</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <style>
      :root {
        --bg: #08131c;
        --panel: rgba(10, 26, 36, 0.84);
        --panel-solid: #0d2330;
        --line: rgba(87, 196, 190, 0.22);
        --ink: #d7ecee;
        --ink-soft: #8fb0b5;
        --accent: #35d6c0;
        --accent-deep: #159c8c;
        --radius: 16px;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.55) 100%);
        z-index: 1;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .panel-title {
        top: 20px;
        left: 20px;
        padding: 15px 20px;
        width: 320px;
      }

      .panel-title h1 {
        margin: 0 0 5px;
        font-size: 19px;
        letter-spacing: -0.01em;
        color: var(--accent);
      }

      .panel-title p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-soft);
      }

      .panel-target {
        top: 20px;
        right: 20px;
        padding: 15px 18px;
        width: 280px;
      }

      .panel-target h2 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--ink-soft);
        font-weight: 600;
      }

      .target-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .target-buttons button {
        font-size: 13px;
        padding: 9px 8px;
      }

      .panel-elements {
        left: 20px;
        top: 172px;
        padding: 15px 18px;
        width: 320px;
      }

      .panel-elements h2 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--ink-soft);
        font-weight: 600;
      }

      .element-row {
        display: flex;
        gap: 8px;
      }

      .element {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 4px 8px;
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        transition: transform 0.12s ease, border-color 0.15s ease;
      }

      .element:hover {
        transform: translateY(-2px);
        border-color: rgba(87, 196, 190, 0.55);
      }

      .element[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      .element .dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.18);
      }

      .element .symbol {
        font-size: 13px;
        font-weight: 700;
      }

      .element .name {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .panel-bar {
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: min(940px, calc(100vw - 40px));
        flex-wrap: wrap;
        justify-content: center;
      }

      .session-panel {
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        padding: 11px 18px;
        text-align: center;
        border-color: rgba(53, 214, 192, 0.45);
      }

      .session-panel[hidden] {
        display: none;
      }

      .session-panel strong {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
      }

      .session-row {
        display: flex;
        gap: 16px;
        font-size: 12.5px;
        color: var(--ink-soft);
      }

      .session-row span {
        font-variant-numeric: tabular-nums;
      }


      .panel-status {
        right: 20px;
        bottom: 22px;
        padding: 12px 16px;
        max-width: 330px;
        font-size: 13px;
        line-height: 1.5;
      }

      .panel-status strong {
        color: var(--accent);
      }

      .panel-status.bad strong {
        color: #ff8f6b;
      }

      button {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 15px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(87, 196, 190, 0.5);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent-deep);
        color: #04231f;
        font-weight: 700;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(53, 214, 192, 0.45);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(53, 214, 192, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .hint {
        position: fixed;
        left: 20px;
        bottom: 22px;
        z-index: 2;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px;
        max-width: 320px;
        line-height: 1.5;
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(87, 196, 190, 0.5);
      }

      @media (max-width: 760px) {
        .panel-title {
          top: 10px;
          left: 10px;
          right: 86px;
          max-width: none;
          padding: 9px 12px;
        }
        .panel-title h1 {
          font-size: 16px;
          margin-bottom: 0;
        }
        .panel-title p {
          display: none;
        }
        .panel-target {
          top: 62px;
          left: 10px;
          right: 10px;
          width: auto;
          padding: 9px 12px;
        }
        .panel-target h2 {
          margin-bottom: 6px;
        }
        .target-buttons {
          grid-template-columns: repeat(4, 1fr);
          gap: 5px;
        }
        .target-buttons button {
          font-size: 11px;
          padding: 7px 4px;
        }
        .panel-elements {
          top: auto;
          bottom: 152px;
          left: 10px;
          right: 10px;
          width: auto;
          padding: 9px 12px;
        }
        .element {
          padding: 6px 3px 5px;
        }
        .element .dot {
          width: 20px;
          height: 20px;
        }
        .element .name {
          display: none;
        }
        .panel-bar {
          left: 10px;
          right: 10px;
          bottom: 10px;
          transform: none;
          max-width: none;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding: 9px 10px;
        }
        .panel-bar button {
          font-size: 12px;
          padding: 8px 11px;
          white-space: nowrap;
        }
        .panel-status {
          left: 10px;
          right: 10px;
          bottom: 196px;
          max-width: none;
          font-size: 12px;
          padding: 8px 12px;
        }
        .session-panel {
          top: 128px;
          left: 10px;
          right: 10px;
          transform: none;
        }
        .back-link {
          top: 10px;
          right: 10px;
          left: auto;
          transform: none;
          padding: 7px 10px;
        }
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="../index.html" target="_top">&#8592; GAMES</a>
    <canvas id="scene" role="img" aria-label="3D 분자 빌더 3D 화면. 원자를 놓고 결합해 목표 분자를 만듭니다. 아래 버튼으로 원자를 고르고 자동 배치·검사를 실행할 수 있습니다."></canvas>
    <div class="vignette"></div>

    <section class="panel panel-title">
      <h1>3D 분자 빌더</h1>
      <p>원자를 놓고 결합으로 이어 붙인 뒤, VSEPR 규칙으로 모양을 정리해 목표 분자를 완성하세요.</p>
    </section>

    <section class="panel panel-target">
      <h2>목표 분자</h2>
      <div class="target-buttons" id="target-buttons"></div>
    </section>

    <section class="panel panel-elements">
      <h2>원자 팔레트</h2>
      <div class="element-row" id="element-row"></div>
    </section>

    <nav class="panel panel-bar">
      <button id="btn-levels" type="button">레벨</button>
      <button id="btn-example" type="button">예시 불러오기</button>
      <button id="btn-layout" type="button">자동 배치</button>
      <button id="btn-check" class="btn-primary btn-pulse" type="button">검사</button>
      <button id="btn-clear" type="button">초기화</button>
    </nav>

    <section class="panel session-panel" id="session-panel" hidden>
      <strong id="session-target"></strong>
      <div class="session-row">
        <span id="session-progress">1 / 3</span>
        <span id="session-timer">90초</span>
        <span id="session-score">점수 0</span>
      </div>
    </section>

    <section class="panel panel-status" id="status" aria-live="polite">
      <strong>준비됨.</strong> 목표 분자를 고르고 <em>예시 불러오기</em>를 눌러 시작하세요.
    </section>

    <p class="hint">원자 클릭: 선택 · 원자 두 개 클릭: 결합 · 결합 클릭: 삭제 · 빈 곳 클릭: 새 원자</p>

    <script>
      (async () => {
        const localMap = {
          imports: {
            three: "../vendor/three.module.js",
            "three/addons/": "../vendor/addons/",
          },
        };
        const remoteMap = {
          imports: {
            three: "https://unpkg.com/three@0.186.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          },
        };
        let map = localMap;
        try {
          await import("../vendor/three.module.js");
        } catch {
          map = remoteMap;
        }
        const tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify(map);
        document.head.append(tag);
        await import("./src/main.js");
      })();
    </script>
  </body>
</html>
